[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-cut"
version = "0.1.0"
description = "Live stream material intelligent clipping MVP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "IP&AI Team" }]
dependencies = ["imageio-ffmpeg>=0.6.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
asr = ["faster-whisper>=1.0.0"]
funasr = ["funasr>=1.0.0"]
oss = ["httpx>=0.27", "minio>=7.2"]
business = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "httpx>=0.27", "minio>=7.2"]
dev = ["ruff>=0.4"]

[project.scripts]
autocut = "autocut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autocut = ["static/*.html", "resources/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
